<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Login – User Management System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrapper" role="main">
    <div class="login-card" aria-labelledby="login-heading">

      <!-- Branding -->
      <div class="login-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <h1 id="login-heading" class="brand-title">User Management System</h1>
        <p class="brand-subtitle">Sign in to your account</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate aria-label="Login form">

        <!-- Global error banner (shown on failed login) -->
        <div id="errorBanner" class="error-banner" role="alert" aria-live="assertive" hidden>
          <span class="error-banner__icon" aria-hidden="true">&#9888;</span>
          <span id="errorMessage">Invalid email or password. Please try again.</span>
        </div>

        <!-- Email field -->
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   width="18" height="18">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="emailError"
            />
          </div>
          <span id="emailError" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password field -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   width="18" height="18">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="passwordError"
            />
            <!-- Toggle password visibility -->
            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   width="18" height="18">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span id="passwordError" class="field-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Remember me -->
        <div class="form-group form-group--inline">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="rememberMe" class="checkbox-input" />
            <span class="checkbox-custom" aria-hidden="true"></span>
            <span class="checkbox-text">Remember me</span>
          </label>
        </div>

        <!-- Submit button -->
        <button type="submit" id="submitBtn" class="btn btn--primary btn--full">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="spinner" hidden aria-hidden="true"></span>
        </button>

      </form>

      <!-- Footer -->
      <p class="login-footer">
        Don't have an account?
        <a href="register.html" class="footer-link">Create one</a>
      </p>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
